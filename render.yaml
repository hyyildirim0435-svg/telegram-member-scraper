services:
  - type: web
    name: telegram-member-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: hyyildirim0435-svg/telegram-member-scraper
      - key: GITHUB_BRANCH
        value: main
      - key: SESSIONS_JSON
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
